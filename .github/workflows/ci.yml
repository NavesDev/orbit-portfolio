name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio_test
      # The home page is statically generated from database rows, so `next
      # build` reads content the same way a Vercel build does. A separate
      # database from the tests': the integration suite creates and drops
      # scratch databases beside `portfolio_test`, and content the build reads
      # has no business living where a test could reach it.
      DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio_build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Prepare the build database
        run: |
          psql "postgres://portfolio:portfolio@localhost:5432/portfolio_test" \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE portfolio_build'
          pnpm db:migrate
          pnpm db:seed

      - name: Build
        run: pnpm build
